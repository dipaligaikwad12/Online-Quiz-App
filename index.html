
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A beginner-friendly interactive online quiz application.">
  <title>QuizMaster | Online Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">QuizMaster</div>
      <p>Test your knowledge</p>
    </header>

    <section class="quiz-card" aria-labelledby="quiz-title">
      <div class="quiz-top">
        <span id="question-count">Question 1 of 10</span>
        <span id="score-label">Score: 0</span>
      </div>

      <div class="progress-track" aria-label="Quiz progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div id="quiz-content">
        <h1 id="quiz-title">Loading question...</h1>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="next-btn" class="primary-btn" disabled>
          Next Question
        </button>
      </div>

      <div id="result-screen" class="hidden">
        <div class="result-icon" aria-hidden="true">🏆</div>
        <h1>Quiz Completed!</h1>
        <p id="result-message"></p>
        <p class="final-score">
          Your score: <strong id="final-score">0 / 10</strong>
        </p>
        <button id="restart-btn" class="primary-btn">
          Try Again
        </button>
      </div>
    </section>

    
  </main>
</body>
</html>
